name: Deploy Bendigo AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify Bendigo AI frontend files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Bendigo AI frontend files are present."
      - name: Prepare Bendigo AI website only
        run: |
          mkdir -p site
          cp index.html style.css script.js site/
          if [ -d assets ]; then cp -R assets site/assets; fi
          for file in *.svg *.png *.jpg *.jpeg *.webp *.ico; do
            [ -f "$file" ] && cp "$file" site/ || true
          done
          test -f site/index.html
          test -f site/style.css
          test -f site/script.js
          test ! -d site/Alien-Forest-Adventure
      - name: Upload Bendigo AI website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
